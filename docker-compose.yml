x-article-scraper: &article-scraper
  build: .
  image: prn-pipeline
  restart: unless-stopped
  depends_on:
    mongo:
      condition: service_healthy
  environment: &article-scraper-env
    MONGO_URI: mongodb://mongo:27017
    MONGO_DB: prn
    SCRAPE_WORKERS: "4"
  command: ["python", "py/scrape/scrape_prn.py", "--no-links", "--loop"]

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  link-scraper:
    build: .
    image: prn-pipeline
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: prn
    command: ["python", "py/scrape/scrape_prn.py", "--no-articles", "--loop"]

  # Article fetching runs as N replicas of one definition (the `x-article-scraper`
  # anchor at the top of this file). Each takes a disjoint hash bucket of the
  # queue via SCRAPE_SHARD=K/N and fetches SCRAPE_WORKERS articles at a time.
  # Both numbers are chosen from measurements in AGENT_NOTES.md: a fetch waits
  # ~0.8s on the wire, so threads pay off, but parsing holds the GIL, which is
  # why the concurrency is spread over processes rather than piled into one.
  # To change N, edit every shard's K/N and add or remove replicas — every
  # bucket must be owned by exactly one process or part of the queue stalls.
  #
  # Only shard 0 rolls up `companies` when its queue empties: the rollup is a
  # full rebuild that reads the corpus, so one replica doing it is plenty and
  # two doing it at once would be two identical rebuilds.
  #
  # Two shards of four is a deliberate eight in flight against one site: the
  # box and the queue would take more, but a ban costs more than the days.
  article-scraper:
    <<: *article-scraper
    environment:
      <<: *article-scraper-env
      SCRAPE_SHARD: "0/2"
    command: ["python", "py/scrape/scrape_prn.py", "--no-links", "--loop", "--rollup-when-idle"]

  article-scraper-1:
    <<: *article-scraper
    environment:
      <<: *article-scraper-env
      SCRAPE_SHARD: "1/2"

  classifier:
    build: .
    image: prn-pipeline
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: prn
      MODEL_DIR: /models
      # Torch otherwise spawns one thread per visible core and takes ~10 of
      # the 14, starving the scraper shards' parsing. fp32 inference on this
      # chip peaks at 8 threads (~10.6k articles/h vs 8.3k at 4; 12+ is
      # slower, the E-cores drag the P-cores). Drop to 4 if the scraper
      # shards need the room.
      OMP_NUM_THREADS: "8"
      # Unset, each pass serves the newest run in /models/launch and keys its
      # predictions by that run's version. Set it to pin one, e.g.
      # MODEL_VERSION: distilbert-finetuned-20260819232201
    volumes:
      - models:/models:ro
    command: ["python", "py/classify/finetune.py", "--classify", "--task", "launch", "--loop"]

  # Second stage: only classifies articles the launch model already called
  # positive, so it sees a few thousand articles rather than the whole corpus.
  ai-classifier:
    build: .
    image: prn-pipeline
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: prn
      MODEL_DIR: /models
      OMP_NUM_THREADS: "4"
      # As above: newest run in /models/ai unless pinned.
    volumes:
      - models:/models:ro
    # Gating on the task name rather than a fixed version, so the gate follows
    # the launch model's newest run. Pass a version string instead to pin it.
    command: ["python", "py/classify/finetune.py", "--classify", "--task", "ai", "--loop",
      "--require-relevant-from", "launch"]

  # One-shot job. Stamps company facts onto scraped articles; append --rollup to
  # rebuild the companies collection from what it stamped. Neither is needed in
  # steady state — the article scraper stamps as it scrapes and rolls up when it
  # goes idle — only after an extractor change bumps a version.
  company-facts:
    build: .
    image: prn-pipeline
    profiles: ["company"]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: prn
    command: ["python", "py/company.py"]

  # External enrichment. Resolves every rolled-up company against Wikidata, SEC,
  # GLEIF, RDAP, the IRS BMF and ROR, and stores what each returns in
  # `company_enrichment`; `company-facts --rollup` folds a subset onto
  # `companies`.
  #
  # Continuous rather than one-shot because it is a polite, rate-limited crawl of
  # ~99k companies, not a job that finishes in one sitting. Resumption is by
  # resolver version, so a restart costs nothing and a company that has already
  # answered is never asked again. The volume holds the bulk downloads (~600 MB,
  # GLEIF being most of it) so a restart does not re-fetch them either.
  enrich:
    build: .
    image: prn-pipeline
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: prn
      ENRICH_DATA_DIR: /data/enrich
      # SEC refuses requests whose User-Agent names no contact, so this is
      # effectively required. It is sent to all six sources on every request —
      # set it in your shell or a .env file to an address you are willing to be
      # contacted at.
      ENRICH_CONTACT: ${ENRICH_CONTACT:-}
    volumes:
      - enrich_data:/data/enrich
    command: ["python", "py/enrich.py", "--loop"]

  # Read-only browser over what the pipeline produced: the product releases the
  # launch model called relevant, joined to their companies. Serves the built
  # Vue SPA and its JSON API from one process on 8080.
  #
  # It owns a denormalized read model (`fe_releases`, `fe_companies`, `fe_meta`)
  # that it rebuilds on startup and every ten minutes, so a page view is one
  # indexed query rather than a join across three collections. That cache is
  # derived and can be dropped at any time. Its image is built from fe/, with
  # the repo root as context, and carries no model runtime.
  web:
    build:
      context: .
      dockerfile: fe/Dockerfile
    image: prn-web
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: prn
      # Set in .env to mark false positives from the release cards; with it
      # unset the app is read-only.
      EXPLORER_LABELER: ${EXPLORER_LABELER:-}
    ports:
      - "8080:8080"

  labeler:
    build: .
    image: prn-pipeline
    profiles: ["labeling"]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: prn
      LABELER_NAME: georgi
      LABEL_REVIEW_DIR: /app/data/labels-for-review
      AI_LABEL_REVIEW_DIR: /app/data/ai-labels-for-review
    volumes:
      - ./data/labels-for-review:/app/data/labels-for-review:ro
      - ./data/ai-labels-for-review:/app/data/ai-labels-for-review:ro
    ports:
      - "8000:8000"
    command: ["uvicorn", "label.app:app", "--host", "0.0.0.0", "--port", "8000"]

  train:
    build: .
    image: prn-pipeline
    profiles: ["training"]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: prn
      MODEL_DIR: /models
    volumes:
      - models:/models
    command: ["python", "py/classify/finetune.py", "--task", "launch"]

  ai-train:
    build: .
    image: prn-pipeline
    profiles: ["training"]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: prn
      MODEL_DIR: /models
    volumes:
      - models:/models
    command: ["python", "py/classify/finetune.py", "--task", "ai"]

volumes:
  mongo_data:
  models:
  enrich_data:
