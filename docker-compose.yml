services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  link-scraper:
    build: .
    image: prn-pipeline
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: prn
    command: ["python", "py/scrape/scrape_prn.py", "--no-articles", "--loop"]

  article-scraper:
    build: .
    image: prn-pipeline
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: prn
    # Rolls up `companies` whenever its queue empties: this is the only service
    # that adds scraped releases, so it is the only one whose idle moment means
    # the derived collection is behind.
    command: ["python", "py/scrape/scrape_prn.py", "--no-links", "--loop", "--rollup-when-idle"]

  classifier:
    build: .
    image: prn-pipeline
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: prn
      MODEL_DIR: /models
      # Unset, each pass serves the newest run in /models/launch and keys its
      # predictions by that run's version. Set it to pin one, e.g.
      # MODEL_VERSION: distilbert-finetuned-20260819232201
    volumes:
      - models:/models:ro
    command: ["python", "py/classify/finetune.py", "--classify", "--task", "launch", "--loop"]

  # Second stage: only classifies articles the launch model already called
  # positive, so it sees a few thousand articles rather than the whole corpus.
  ai-classifier:
    build: .
    image: prn-pipeline
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: prn
      MODEL_DIR: /models
      # As above: newest run in /models/ai unless pinned.
    volumes:
      - models:/models:ro
    # Gating on the task name rather than a fixed version, so the gate follows
    # the launch model's newest run. Pass a version string instead to pin it.
    command: ["python", "py/classify/finetune.py", "--classify", "--task", "ai", "--loop",
      "--require-relevant-from", "launch"]

  # One-shot job. Stamps company facts onto scraped articles; append --rollup to
  # rebuild the companies collection from what it stamped. Neither is needed in
  # steady state — the article scraper stamps as it scrapes and rolls up when it
  # goes idle — only after an extractor change bumps a version.
  company-facts:
    build: .
    image: prn-pipeline
    profiles: ["company"]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: prn
    command: ["python", "py/company.py"]

  # External enrichment. Resolves every rolled-up company against Wikidata, SEC,
  # GLEIF, RDAP, the IRS BMF and ROR, and stores what each returns in
  # `company_enrichment`; `company-facts --rollup` folds a subset onto
  # `companies`.
  #
  # Continuous rather than one-shot because it is a polite, rate-limited crawl of
  # ~99k companies, not a job that finishes in one sitting. Resumption is by
  # resolver version, so a restart costs nothing and a company that has already
  # answered is never asked again. The volume holds the bulk downloads (~600 MB,
  # GLEIF being most of it) so a restart does not re-fetch them either.
  enrich:
    build: .
    image: prn-pipeline
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: prn
      ENRICH_DATA_DIR: /data/enrich
      # SEC refuses requests whose User-Agent names no contact, so this is
      # effectively required. It is sent to all six sources on every request —
      # set it in your shell or a .env file to an address you are willing to be
      # contacted at.
      ENRICH_CONTACT: ${ENRICH_CONTACT:-}
    volumes:
      - enrich_data:/data/enrich
    command: ["python", "py/enrich.py", "--loop"]

  labeler:
    build: .
    image: prn-pipeline
    profiles: ["labeling"]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: prn
      LABELER_NAME: georgi
      LABEL_REVIEW_DIR: /app/data/labels-for-review
      AI_LABEL_REVIEW_DIR: /app/data/ai-labels-for-review
    volumes:
      - ./data/labels-for-review:/app/data/labels-for-review:ro
      - ./data/ai-labels-for-review:/app/data/ai-labels-for-review:ro
    ports:
      - "8000:8000"
    command: ["uvicorn", "label.app:app", "--host", "0.0.0.0", "--port", "8000"]

  train:
    build: .
    image: prn-pipeline
    profiles: ["training"]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: prn
      MODEL_DIR: /models
    volumes:
      - models:/models
    command: ["python", "py/classify/finetune.py", "--task", "launch"]

  ai-train:
    build: .
    image: prn-pipeline
    profiles: ["training"]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: prn
      MODEL_DIR: /models
    volumes:
      - models:/models
    command: ["python", "py/classify/finetune.py", "--task", "ai"]

volumes:
  mongo_data:
  models:
  enrich_data:
